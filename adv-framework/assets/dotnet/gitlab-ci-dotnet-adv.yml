# ============================================================================
# Automated Deterministic Verification pipeline — ASP.NET / GitLab CI
# Each stage only runs if the previous stage passed. Every job is pass/fail.
# ============================================================================

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - static
  - build
  - unit
  - property
  - contract
  - regression
  - deploy-gate

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages

# ---------------------------------------------------------------------------
# STAGE 1: STATIC
# ---------------------------------------------------------------------------

format-check:
  stage: static
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    # fails (non-zero exit) if any file isn't already formatted —
    # backed by .editorconfig, doesn't rewrite files here
    - dotnet format --verify-no-changes --severity warn
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

roslyn-analyzers:
  stage: static
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    # Microsoft.CodeAnalysis.NetAnalyzers ships in the SDK — enforce as
    # build-breaking via <EnforceCodeStyleInBuild> + <AnalysisMode> in
    # Directory.Build.props (see the .props fragment), then just build:
    - dotnet build --no-incremental -warnaserror
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security-code-scan:
  stage: static
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    # SecurityCodeScan is a Roslyn analyzer package (added via csproj) —
    # catches SQL injection, XXE, weak crypto, path traversal, etc.
    # Runs as part of build once referenced; this job isolates its output.
    - dotnet build --no-incremental -p:RunAnalyzersDuringBuild=true 2>&1 | tee security-scan.log
    - '! grep -q "SCS[0-9]" security-scan.log'
  artifacts:
    when: always
    paths:
      - security-scan.log
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sast:
  stage: static

dependency_scanning:
  stage: static

secret_detection:
  stage: static

# ---------------------------------------------------------------------------
# STAGE 2: BUILD
# ---------------------------------------------------------------------------

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore
  artifacts:
    paths:
      - "**/bin/Release/"
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# STAGE 3: UNIT — xUnit + coverlet coverage, diff-cover gate
# ---------------------------------------------------------------------------

unit-test:
  stage: unit
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    # Filter excludes Property/Regression categories so this stays fast —
    # relies on [Trait("Category", "Property")] etc. on those test classes
    - >
      dotnet test --configuration Release --no-build
      --filter "Category!=Property&Category!=Regression"
      --collect:"XPlat Code Coverage"
      --logger "junit;LogFilePath=../unit-report.xml"
      --results-directory ./TestResults
    - dotnet tool install -g dotnet-reportgenerator-globaltool
    - >
      ~/.dotnet/tools/reportgenerator
      -reports:./TestResults/**/coverage.cobertura.xml
      -targetdir:./coverage-report
      -reporttypes:Cobertura
  coverage: '/Total\s*\|\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      junit: unit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-report/Cobertura.xml
    paths:
      - coverage-report/
    expire_in: 1 week

diff-coverage-gate:
  stage: unit
  image: python:3.12-slim
  needs: ["unit-test"]
  script:
    - pip install diff-cover
    - diff-cover coverage-report/Cobertura.xml --compare-branch=origin/$CI_DEFAULT_BRANCH --fail-under=80
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# STAGE 4: PROPERTY / INVARIANT — FsCheck
# ---------------------------------------------------------------------------

property-test:
  stage: property
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - >
      dotnet test --configuration Release --no-build
      --filter "Category=Property"
      --logger "junit;LogFilePath=../property-report.xml"
  artifacts:
    reports:
      junit: property-report.xml

# ---------------------------------------------------------------------------
# STAGE 5: CONTRACT / INTEGRATION
# ---------------------------------------------------------------------------

openapi-contract-test:
  stage: contract
  image: schemathesis/schemathesis
  script:
    # ASP.NET Core generates OpenAPI natively via Microsoft.AspNetCore.OpenApi
    # (or Swashbuckle) — point Schemathesis at the running service's spec
    - schemathesis run --checks all $STAGING_API_URL/openapi/v1.json --base-url=$STAGING_API_URL
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

ef-migration-check:
  stage: contract
  image: mcr.microsoft.com/dotnet/sdk:8.0
  services:
    - postgres:16
  variables:
    POSTGRES_DB: migration_check
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    ConnectionStrings__Default: "Host=postgres;Database=migration_check;Username=ci;Password=ci"
  script:
    - dotnet tool install -g dotnet-ef
    # applies every migration against a throwaway DB, then rolls back to
    # the initial migration to catch broken Down() methods too
    - ~/.dotnet/tools/dotnet-ef database update
    - ~/.dotnet/tools/dotnet-ef database update 0

pact-contract-verify:
  stage: contract
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - >
      dotnet test --configuration Release --no-build
      --filter "Category=PactVerification"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Controllers/**"

# ---------------------------------------------------------------------------
# STAGE 6: REGRESSION — Verify snapshot testing
# ---------------------------------------------------------------------------

golden-file-regression:
  stage: regression
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - >
      dotnet test --configuration Release --no-build
      --filter "Category=Regression"
      --logger "junit;LogFilePath=../regression-report.xml"
  artifacts:
    reports:
      junit: regression-report.xml
    when: on_failure
    paths:
      # Verify writes *.received.* files next to *.verified.* on mismatch —
      # keep them so a failure is diffable without re-running locally
      - "**/*.received.*"
    expire_in: 3 days

# ---------------------------------------------------------------------------
# STAGE 7: DEPLOY GATE
# ---------------------------------------------------------------------------

smoke-test:
  stage: deploy-gate
  image: mcr.microsoft.com/playwright:v1.48.0-jammy
  script:
    - npx playwright test tests/smoke --reporter=line
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  stage: deploy-gate
  needs: ["smoke-test"]
  script:
    - echo "Deploying — replace with real deploy step (Azure App Service / IIS / container)"
    - echo "Configure your CD platform's health-check + auto-rollback here"
  environment:
    name: production
    on_stop: rollback-production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

rollback-production:
  stage: deploy-gate
  script:
    - echo "Rollback triggered — wire this to your CD platform's rollback command"
  environment:
    name: production
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
